<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safe Link</title>
</head>
<body>

    <script>
        // 1. URL se AdSterra ka direct link nikalne ka logic
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');

        // 2. Facebook ke bot ko pehchanna
        const isBot = /facebookexternalhit|Facebot|Twitterbot|Pinterestbot/i.test(navigator.userAgent);

        if (isBot) {
            // Agar Facebook ka bot aaye, to use yahin rok do (kuch mat dikhao ya blank chor do)
            document.body.innerHTML = "<h3>Content Not Available</h3>";
        } else if (targetUrl) {
            // Agar asli user click kare, to use furan aap ke AdSterra link par bhej do
            window.location.href = targetUrl;
        } else {
            window.location.href = "https://google.com";
        }
    </script>

</body>
</html>
